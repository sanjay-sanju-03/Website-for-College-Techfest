<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER'25 Certificates</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #101010 0%, #232323 100%);
            font-family: 'Roboto Mono', 'Space Mono', Arial, sans-serif;
            color: var(--gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 16px 60px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 90px; /* Prevent nav overlap */
            flex: 1 0 auto;
        }
        :root {
            --yellow: #ffd600;
            --black: #101010;
            --gray: #eaeaea;
            --card-bg: #181818;
        }
        .cert-title {
            font-family: 'Rubik Dirt', 'Roboto Mono', monospace, Arial, sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--yellow);
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }
        .cert-subtitle {
            font-size: 1.2rem;
            color: #fffbe7;
            margin-bottom: 40px;
            text-align: center;
            font-family: 'Roboto Mono', monospace;
        }
        .cert-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .cert-card {
            flex: 1 1 280px;
            max-width: 320px;
            min-width: 250px;
            background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
            color: var(--gray);
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .cert-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 214, 0, 0.1), transparent);
            transition: left 0.5s;
        }
        .cert-card:hover::before {
            left: 100%;
        }
        .cert-card:hover, .cert-card:focus {
            background: linear-gradient(145deg, #2a2a2a 0%, #3a3a3a 100%);
            color: var(--yellow);
            box-shadow: 0 16px 48px rgba(255, 214, 0, 0.2);
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 214, 0, 0.3);
        }
        .cert-card::after {
            content: '📜';
            font-size: 2rem;
            margin-bottom: 16px;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        .cert-card:hover::after {
            opacity: 1;
            transform: scale(1.1);
        }
        .cert-card span {
            position: relative;
            z-index: 1;
        }
        @media (max-width: 1100px) {
            .cert-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
            }
        }
        @media (max-width: 700px) {
            .cert-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .main-container {
                padding: 24px 4vw 40px 4vw;
            }
            .cert-card {
                min-height: 140px;
                padding: 28px 20px;
            }
        }
        @media (max-width: 500px) {
            .cert-title {
                font-size: 1.5rem;
            }
            .cert-card {
                font-size: 1rem;
                padding: 24px 16px;
                min-height: 120px;
            }
            .cert-card::after {
                font-size: 1.5rem;
                margin-bottom: 12px;
            }
        }
        footer {
            width: 100%;
            text-align: center;
            padding: 24px 0 12px 0;
            color: #888;
            font-size: 1rem;
            background: transparent;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- Navigation (copied from index.html) -->
    <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#contact">Contact</a>
        <a href="index.html">
            <img src="images/dept.png" alt="CIPHER'25 Logo" class="nav-logo">
        </a>
    </nav>
    <div class="main-container">
        <div class="cert-title">CIPHER'25 Certificates</div>
        <div class="cert-subtitle">Explore and download your certificates</div>
        <div class="cert-grid">
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>CIPHERTHON'25</span>
            </a>
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>ENGINEERING THE FUTURE</span>
            </a>
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>TECH TALK</span>
            </a>
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>QUEST-ION – The Ultimate Tech Quiz!</span>
            </a>
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>Clash of Minds</span>
            </a>
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>UXPLORE - A UI/UX design challenge</span>
            </a>
            <a class="cert-card" href="#" target="_blank" rel="noopener noreferrer">
                <span>CLOUDSPACE</span>
            </a>
        </div>
    </div>
    <footer>
        &copy; <span id="year"></span> CIPHER'25 | ASSOCIATION OF B-TECH IN IT, 2024-25 | LBSCEK
    </footer>
    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
