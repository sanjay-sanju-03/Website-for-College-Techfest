<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPHER25 | Certificate Verification</title>
  <style>
    body {
      background-color: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      color: #f1f5f9;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #22c55e;
    }

    .status {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .status.valid {
      color: #22c55e;
    }

    .status.invalid {
      color: #ef4444;
    }

    .detail-box {
      background-color: #0f172a;
      padding: 1rem;
      border-radius: 8px;
    }

    .detail-box p {
      margin: 0.6rem 0;
      font-size: 1rem;
    }

    .label {
      color: #94a3b8;
    }

    @media (max-width: 500px) {
      body {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="cert-title">Certificate Verification</h2>
    <div class="status" id="status">Checking...</div>
    <div class="detail-box" id="details" style="display: none;"></div>
  </div>

  <script>
    const certId = new URLSearchParams(window.location.search).get("cert");
    const statusEl = document.getElementById("status");
    const detailsEl = document.getElementById("details");

    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRk-Wu2A2hYVmaEVydRXlwBF4ev2ErIoEiBkKNN9hiPxhLJj9r09RAlpUGq_MPheGeolCxwkX_lIyGT/pubhtml";

    if (!certId) {
      statusEl.textContent = "No certificate ID provided.";
      statusEl.className = "status invalid";
    } else {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(csv => {
          const [headerLine, ...lines] = csv.trim().split("\n");
          const headers = headerLine.split(",");
          const records = lines.map(line => {
            const values = line.split(",");
            return Object.fromEntries(values.map((val, i) => [headers[i].trim(), val.trim()]));
          });

          const cert = records.find(r => r["Certificate ID"] === certId);

          if (cert) {
            statusEl.textContent = "✅ Valid Certificate";
            statusEl.className = "status valid";

            detailsEl.innerHTML = `
              <p><span class="label">Name:</span> ${cert["Name"]}</p>
              <p><span class="label">Event:</span> ${cert["Event"]}</p>
              <p><span class="label">Date:</span> ${cert["Date"]}</p>
              <p><span class="label">Type:</span> ${cert["Type"]}</p>
            `;
            detailsEl.style.display = "block";
          } else {
            statusEl.textContent = "❌ Invalid Certificate ID";
            statusEl.className = "status invalid";
          }
        })
        .catch(() => {
          statusEl.textContent = "Error fetching verification data.";
          statusEl.className = "status invalid";
        });
    }
  </script>
</body>
</html>
